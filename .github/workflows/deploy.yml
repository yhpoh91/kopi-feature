# Required GitHub repository secrets (Settings → Secrets → Actions):
#   AWS_DEPLOY_ROLE_ARN — IAM role ARN for OIDC federation
#   AWS_REGION          — deployment region (e.g. ap-southeast-1)

name: Deploy

on:
  push:
    branches: ['**']

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Security audit
        # --omit=dev audits only production dependencies (what runs in Lambda).
        # DevDependency vulnerabilities (e.g. in Serverless CLI, Vitest) are CI tooling concerns
        # tracked separately via Dependabot, not as deploy blockers.
        run: npm audit --audit-level=high --omit=dev

  deploy-preview:
    name: Deploy (preview)
    needs: ci
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Ensure deployment bucket
        run: |
          REGION="${{ secrets.AWS_REGION || 'ap-southeast-1' }}"
          BUCKET="kopi-feature-sls-deployments"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating deployment bucket $BUCKET..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "Created."
          else
            echo "Bucket $BUCKET already exists."
          fi

      - name: Check for pending migrations
        run: npm run migrate:check:preview

      - name: Ensure Secrets Manager secrets
        run: |
          REGION="${{ secrets.AWS_REGION || 'ap-southeast-1' }}"
          ensure_secret() {
            local name="$1" value="$2"
            if ! aws secretsmanager describe-secret --secret-id "$name" --region "$REGION" >/dev/null 2>&1; then
              aws secretsmanager create-secret --name "$name" --secret-string "$value" --region "$REGION"
              echo "Created: $name"
            else
              echo "Exists:  $name"
            fi
          }
          # Add project secrets here as they are introduced in future milestones, e.g.:
          # ensure_secret "kopi-feature/preview/sso-client-secret" "${{ secrets.SSO_CLIENT_SECRET_PREVIEW }}"

      - name: Deploy → Preview
        run: npx serverless deploy --stage preview --verbose

  deploy-prod:
    name: Deploy (prod)
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-southeast-1' }}

      - name: Ensure deployment bucket
        run: |
          REGION="${{ secrets.AWS_REGION || 'ap-southeast-1' }}"
          BUCKET="kopi-feature-sls-deployments"
          if ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Creating deployment bucket $BUCKET..."
            aws s3api create-bucket \
              --bucket "$BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET" \
              --server-side-encryption-configuration \
                '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block \
              --bucket "$BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
            echo "Created."
          else
            echo "Bucket $BUCKET already exists."
          fi

      - name: Check for pending migrations
        run: npm run migrate:check:prod

      - name: Ensure Secrets Manager secrets
        run: |
          REGION="${{ secrets.AWS_REGION || 'ap-southeast-1' }}"
          ensure_secret() {
            local name="$1" value="$2"
            if ! aws secretsmanager describe-secret --secret-id "$name" --region "$REGION" >/dev/null 2>&1; then
              aws secretsmanager create-secret --name "$name" --secret-string "$value" --region "$REGION"
              echo "Created: $name"
            else
              echo "Exists:  $name"
            fi
          }
          # Add project secrets here as they are introduced in future milestones, e.g.:
          # ensure_secret "kopi-feature/prod/sso-client-secret" "${{ secrets.SSO_CLIENT_SECRET_PROD }}"

      - name: Deploy → Production
        run: npx serverless deploy --stage prod --verbose
